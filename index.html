<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Upscaler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 { font-size: 2rem; margin-bottom: 8px; }
    p.sub { color: #aaa; margin-bottom: 32px; }

    .upload-box {
      border: 2px dashed #444;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      width: 100%;
      max-width: 480px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: #888; }

    .upload-box input { display: none; }

    .upload-box label {
      cursor: pointer;
      display: block;
    }

    #preview {
      margin-top: 20px;
      max-width: 480px;
      width: 100%;
      border-radius: 12px;
      display: none;
    }

    button {
      margin-top: 20px;
      background: #6c47ff;
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5535dd; }
    button:disabled { background: #444; cursor: not-allowed; }

    #status { margin-top: 16px; color: #aaa; font-size: 0.9rem; }

    #result-section { margin-top: 32px; text-align: center; display: none; }
    #result-section h2 { margin-bottom: 12px; }
    #result-img {
      max-width: 480px;
      width: 100%;
      border-radius: 12px;
    }
    #download-btn {
      display: inline-block;
      margin-top: 16px;
      background: #22c55e;
      color: white;
      padding: 12px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <h1>Image Upscaler</h1>
  <p class="sub">Upload any image and we'll make it 2x sharper using AI</p>

  <div class="upload-box">
    <label for="file-input">
      <p>Click here to choose an image</p>
      <p style="color:#aaa; font-size:0.85rem; margin-top:8px;">JPG, PNG supported</p>
      <input type="file" id="file-input" accept="image/*" />
    </label>
  </div>

  <img id="preview" alt="Preview" />

  <button id="upscale-btn" disabled>Upscale Image</button>
  <p id="status"></p>

  <div id="result-section">
    <h2>Your upscaled image</h2>
    <img id="result-img" alt="Upscaled result" />
    <br/>
    <a id="download-btn" href="#" download="upscaled.png">Download</a>
  </div>

  <script>
    const fileInput = document.getElementById("file-input");
    const preview = document.getElementById("preview");
    const upscaleBtn = document.getElementById("upscale-btn");
    const status = document.getElementById("status");
    const resultSection = document.getElementById("result-section");
    const resultImg = document.getElementById("result-img");
    const downloadBtn = document.getElementById("download-btn");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      upscaleBtn.disabled = false;
      resultSection.style.display = "none";
      status.textContent = "";
    });

    upscaleBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      upscaleBtn.disabled = true;
      status.textContent = "Upscaling... this takes about 30 seconds...";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("http://127.0.0.1:5000/upscale", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

       if (data.result_b64) {
  const imgSrc = "data:image/png;base64," + data.result_b64;
  resultImg.src = imgSrc;
  downloadBtn.href = imgSrc;
        } else {
          status.textContent = "Error: " + data.error;
        }
      } catch (err) {
        status.textContent = "Something went wrong. Is the server running?";
      }

      upscaleBtn.disabled = false;
    });
  </script>

</body>
</html>
